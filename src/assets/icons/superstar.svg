<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Trophy Cup -->
  <rect x="60" y="50" width="80" height="70" rx="15" ry="15" fill="#FFD700" stroke="black" stroke-width="4" />
  
  <!-- Trophy Handles -->
  <path d="M 40 70 C 20 70, 20 110, 40 110" fill="none" stroke="black" stroke-width="4" />
  <path d="M 160 70 C 180 70, 180 110, 160 110" fill="none" stroke="black" stroke-width="4" />
  
  <!-- Trophy Base -->
  <rect x="75" y="120" width="50" height="20" fill="#FFD700" stroke="black" stroke-width="4" />
  
  <!-- Trophy Stem -->
  <rect x="95" y="140" width="10" height="40" fill="#FFD700" stroke="black" stroke-width="4" />
  
  <!-- Star on the Trophy (Superstar symbol) -->
  <polygon points="100,30 110,70 150,70 115,90 125,130 100,105 75,130 85,90 50,70 90,70"
    fill="white" stroke="black" stroke-width="2" />
</svg>
